<!DOCTYPE html>
<html lang="es">
<head>
  <title>FOrmulario de ejemplo</title>
  <meta charset = "UTF-8">
</head>
<body>
  <!-- action="loginBasico.php": Especifica el archivo que procesará los datos del formulario method="post": Indica que los datos se enviarán de forma segura (no visible en la URL) -->
  <form action="loginBasico.php" method="post">

    <!-- name="usuario": Identificador único para este campo en el backend type="text": Permite ingresar texto visible -->
      <input name="usuario" type="text">

       <!-- name="clave": Identificador único para este campo en el backend type="password": Oculta los caracteres ingresados (muestra puntos o asteriscos) -->
      <input name="clave" type="password">

       <!-- type="submit": Ejecuta el envío del formulario al hacer clic -->
      <input type="submit">
  </form>
</body>
</html>
